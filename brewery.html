<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bar · Riverside Brewing Co.</title>
<script>
  // The brewery moved to the site root (index.html). Keep shared links
  // working: same query, same route (the bar itself, #/, if none was given,
  // so a query here is never mistaken for a legacy Pilsner bookmark).
  // replace() keeps this page out of the history, so Back does not bounce.
  location.replace('./' + location.search + (location.hash && location.hash !== '#' ? location.hash : '#/'));
</script>
<meta http-equiv="refresh" content="0; url=./">
</head>
<body>
<p><a href="./">Riverside Brewing Co.: the bar has moved here.</a></p>
</body>
</html>
