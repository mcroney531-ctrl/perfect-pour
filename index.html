<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Perfect Pour (prototype v2.3)</title>
<style>
  :root {
    --bg: #1b1510; --panel: #2a2119; --panel-2: #33281e; --ink: #f6eedf; --muted: #c9b89c;
    --line: #5c4a37; --accent: #f2b632; --accent-ink: #1b1510; --focus: #8fd0ff;
    --good: #9fdc8a; --bad: #ff9b85;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* No page scroll and no rubber-band: every pixel of a phone in portrait is
     spoken for, and a bounce mid-pour reads as the glass jumping. Scrolling is
     re-allowed only inside the panels that need it (result sheet, debug). */
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  button, input, select { font: inherit; color: inherit; }
  /* 44 px floor on every target (spec §6). manipulation kills double-tap zoom,
     which otherwise eats the second of two quick taps on Restart or the toggle. */
  button {
    min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--panel); cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled, button[aria-disabled="true"] { opacity: 0.45; cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  kbd {
    font: 600 0.75em/1 ui-monospace, monospace; padding: 2px 5px; margin-left: 6px;
    border: 1px solid currentColor; border-radius: 4px; opacity: 0.7;
  }
  /* Key hints are clutter on a phone, where there is no keyboard to press. */
  @media (hover: none) { kbd { display: none; } }

  #app {
    height: 100vh; height: 100dvh;
    max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 6px;
    padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 800; letter-spacing: 0.01em; line-height: 1.1; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 0.75rem; }
  /* The mode switcher doubles as the always-visible mode label (spec §1). */
  #modes { display: flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  #modes button { border: 0; border-radius: 0; background: transparent; padding: 0 12px; font-weight: 600; }
  #modes button + button { border-left: 2px solid var(--line); }
  #modes button[aria-current="true"] { background: var(--ink); color: var(--bg); }

  #caption {
    min-height: 2.8em; margin: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; font-weight: 700; font-size: 1.08rem;
  }
  #caption.hint { color: var(--accent); }

  /* The pour button and the scene never scroll or zoom under a finger; a slip
     sideways while holding must not turn into a pan (lesson from Dine-O Dash). */
  #stage { position: relative; flex: 1 1 auto; min-height: 170px; touch-action: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene text { font-family: system-ui, sans-serif; fill: var(--muted); }

  #controls { display: flex; flex-direction: column; gap: 12px; }
  /* Space between the angle control and the pour button: a thumb heading for
     one must not clip the other (spec §6, prototype question 3). */
  #angleCtl { padding: 4px 8px; border-radius: 14px; border: 2px solid transparent; touch-action: none; }
  #angleCtl.pulse { animation: pulse 0.9s ease-in-out infinite; border-color: var(--accent); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242, 182, 50, 0.35); } }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .ctl-head output { font-variant-numeric: tabular-nums; color: var(--muted); }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0;
    background: transparent; touch-action: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line);
  }
  input[type="range"]::-moz-range-track {
    height: 10px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--line);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 40px; height: 40px; margin-top: -16px; border-radius: 50%;
    background: var(--ink); border: 4px solid var(--accent);
  }
  input[type="range"]::-moz-range-thumb {
    width: 34px; height: 34px; border-radius: 50%; background: var(--ink); border: 4px solid var(--accent);
  }
  .ticks { position: relative; height: 1.1em; font-size: 0.75rem; color: var(--muted); }
  .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .ticks span:first-child { transform: none; }

  #angleToggle {
    width: 100%; min-height: 52px; padding: 0; display: flex; overflow: hidden; border-radius: 14px;
  }
  #angleToggle .opt {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-weight: 700; color: var(--muted);
  }
  /* The selected side is marked by fill, a tick and bold text, not hue alone. */
  #angleToggle .opt::before { content: "○"; font-weight: 400; }
  #angleToggle[aria-checked="false"] .opt-up,
  #angleToggle[aria-checked="true"] .opt-tilt { background: var(--ink); color: var(--bg); }
  #angleToggle[aria-checked="false"] .opt-up::before,
  #angleToggle[aria-checked="true"] .opt-tilt::before { content: "●"; }

  #pourRow { display: flex; gap: 10px; align-items: stretch; }
  #pour {
    flex: 1; min-height: 76px; font-size: 1.25rem; font-weight: 800;
    background: var(--accent); color: var(--accent-ink); border-color: transparent;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #pour[aria-pressed="true"] { background: #ffd877; box-shadow: inset 0 5px 0 rgba(0, 0, 0, 0.28); }
  #pour .sub { display: block; font-size: 0.78rem; font-weight: 600; opacity: 0.8; }
  /* The pour pad: big enough for a thumb to rest on and slide. The track at
     its right edge shows the glass angle (top = upright), so the thumb and the
     glass report the same thing. */
  #pour { position: relative; min-height: 112px; display: flex; align-items: center; justify-content: center; padding: 0 56px 0 16px; }
  #pour.cue { box-shadow: 0 0 0 4px var(--ink); }
  #pour:has(#padTrack[hidden]) { padding: 0 16px; }
  /* The demo thumb (Watch only). Its travel matches CONTROL.padTravel. */
  #padFinger {
    position: absolute; left: 18%; width: 38px; height: 46px; margin: -23px 0 0 -19px;
    border-radius: 50% 50% 45% 45%; background: rgba(27, 21, 16, 0.22);
    border: 2px solid rgba(27, 21, 16, 0.55); pointer-events: none; z-index: 0;
  }
  #pour .padText { position: relative; z-index: 1; }
  #padTrack { position: absolute; right: 16px; top: 14px; bottom: 14px; width: 8px; border-radius: 4px; background: rgba(27, 21, 16, 0.25); }
  #padThumb { position: absolute; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent-ink); border: 3px solid #fff6dc; }
  #padTrack::before { content: "▲"; position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 9px; opacity: 0.6; }
  .tapmode {
    width: 92px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; text-align: center; font-size: 0.72rem; line-height: 1.15; color: var(--muted);
    border: 2px solid var(--line); border-radius: 12px; padding: 4px; cursor: pointer;
  }
  .tapmode input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }

  #actions, #ghostActions { display: flex; gap: 10px; }
  #actions button, #ghostActions button { flex: 1; min-height: 48px; font-weight: 700; }
  /* During the demo the controls are locked but must stay fully visible: the
     point is to watch them move. */
  #controls.demo #pour, #controls.demo #angleToggle, #controls.demo #angleSlider { opacity: 1; pointer-events: none; }
  #serve:not(:disabled) { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  #transcriptBox { font-size: 0.85rem; color: var(--muted); }
  #transcript { margin: 4px 0 0; padding-left: 1.4em; }
  #transcript li[aria-current="step"] { color: var(--ink); font-weight: 700; }
  #transcript li[aria-current="step"]::marker { content: "▶ "; }
  .fineprint { font-size: 0.72rem; color: var(--muted); margin: 4px 0 0; }

  /* Result sheet: slides over the controls, leaves the glass in view. */
  /* z-index: the sheet must sit above the pour pad, whose text is lifted
     over the demo thumb (playtest: pad text showed through the sheet). */
  #result {
    position: fixed; z-index: 15; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(520px, 100%); max-height: 72dvh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--panel); border: 2px solid var(--line); border-bottom: 0;
    border-radius: 18px 18px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5);
    padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-user-select: text; user-select: text;
  }
  #result h2 { margin: 0 0 8px; font-size: 1.35rem; }
  .chk-head { margin: 4px 0 4px; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .checks { list-style: none; margin: 0 0 8px; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .checks.two { grid-template-columns: repeat(2, 1fr); }
  .checks li { border: 2px solid var(--line); border-radius: 10px; padding: 6px; font-size: 0.82rem; text-align: center; }
  .checks li b { display: block; font-size: 1.0rem; }
  .checks li.ok { border-color: var(--good); }
  .checks li.miss { border-color: var(--bad); border-style: dashed; }
  #fbPrimary { margin: 0 0 6px; font-size: 1.02rem; }
  /* Debrief: a little training glass with the two bands and where you acted. */
  #debrief { display: flex; gap: 12px; align-items: center; margin: 2px 0 8px; }
  #debriefGlass { width: 84px; height: 105px; flex: none; }
  #debriefText { margin: 0; font-size: 0.9rem; color: var(--muted); min-width: 0; }
  #debriefText b { color: var(--ink); }
  #caption.verdict { color: var(--good); }
  #fbSecondary { margin: 0 0 6px; color: var(--muted); font-size: 0.92rem; }
  #suggest { margin: 0 0 6px; color: var(--accent); font-weight: 600; }
  #resultActions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #resultActions button { flex: 1 1 30%; min-height: 48px; font-weight: 700; }
  #resultActions button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* Debug panel (?debug=1). Plain and dense on purpose. */
  #debugToggle { position: relative; z-index: 20; padding: 0; margin-right: auto; }
  #debug {
    position: fixed; z-index: 19; top: 0; left: 0; width: min(380px, 100vw); max-height: 85dvh;
    overflow-y: auto; overscroll-behavior: contain; padding: 64px 12px 12px;
    background: rgba(15, 11, 8, 0.94); border: 1px solid var(--line); border-radius: 0 0 12px 0;
    font: 12px/1.35 ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text;
  }
  #debug h3 { font: 700 12px/1 system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 0 6px; }
  #debug pre { margin: 0; white-space: pre-wrap; }
  #debug .grid { display: grid; grid-template-columns: 1fr 88px; gap: 4px 8px; align-items: center; }
  #debug input, #debug select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 100%; -webkit-user-select: text; user-select: text; }
  #debug button { min-height: 36px; font-size: 12px; padding: 0 10px; margin: 4px 4px 0 0; }
  #debug .warn { color: var(--accent); }

  /* Landscape on a phone: glass on the left, everything you touch on the right. */
  @media (orientation: landscape) and (max-height: 560px) {
    #app {
      max-width: none; display: grid; column-gap: 20px; row-gap: 4px;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 400px);
      grid-template-rows: auto auto minmax(0, 1fr);
    }
    header { grid-column: 1 / -1; }
    #stage { grid-column: 1; grid-row: 2 / 4; }
    #caption { grid-column: 2; grid-row: 2; min-height: 2.4em; }
    #controls { grid-column: 2; grid-row: 3; overflow-y: auto; gap: 8px; }
    #pour { min-height: 84px; }
  }

  /* Reduced motion: no pulse, no bubbles, no wobble (the renderer checks the
     same query). The pulse becomes a static dashed ring so the cue survives. */
  @media (prefers-reduced-motion: reduce) {
    #angleCtl.pulse, #pour.cue { animation: none; border-style: dashed; box-shadow: none; }
    #pour.cue { outline: 4px dashed var(--ink); outline-offset: 2px; }
  }
</style>
</head>
<body>
<div id="pp-root"></div>

<!-- The Pilsner station's markup, cloned in by PilsnerStation.mount(). -->
<template id="pp-pilsner-station">
<div id="app">
  <header>
    <div class="brand">Perfect Pour<small>Pilsner · v2.3</small></div>
    <button type="button" id="debugToggle" aria-expanded="false" aria-controls="debug" aria-label="Debug panel" hidden>⚙</button>
    <nav id="modes" aria-label="Mode">
      <button type="button" data-mode="watch">Watch</button>
      <button type="button" data-mode="guided">Guided</button>
      <button type="button" data-mode="solo">Solo</button>
    </nav>
  </header>

  <p id="caption"></p>

  <div id="stage">
    <svg id="scene" viewBox="0 -24 340 424" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">Pilsner glass under the tap.</title>
      <desc id="sceneDesc">Level and head are announced as you pour.</desc>
      <defs>
        <clipPath id="glassClip" clipPathUnits="userSpaceOnUse"><polygon id="clipPoly" points="0,0"/></clipPath>
        <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7c948"/>
          <stop offset="0.6" stop-color="#e7a526"/>
          <stop offset="1" stop-color="#c9811a"/>
        </linearGradient>
        <pattern id="foamPat" width="9" height="8" patternUnits="userSpaceOnUse">
          <circle cx="2.5" cy="2.5" r="1.7" fill="#e9dcbd"/>
          <circle cx="7" cy="6" r="1.2" fill="#ece1c6"/>
        </pattern>
        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="5" stroke="#f6eedf" stroke-width="1.4"/>
        </pattern>
        <!-- Faucet materials: warm brushed metal, not cold chrome. -->
        <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3ead9"/><stop offset="0.45" stop-color="#cdc2ae"/><stop offset="1" stop-color="#857b6c"/>
        </linearGradient>
        <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a8072"/><stop offset="0.3" stop-color="#efe5d2"/><stop offset="0.62" stop-color="#cbbfab"/><stop offset="1" stop-color="#7d7466"/>
        </linearGradient>
        <linearGradient id="handleWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2e1a0d"/><stop offset="0.38" stop-color="#6e4325"/><stop offset="0.7" stop-color="#57331b"/><stop offset="1" stop-color="#2a170b"/>
        </linearGradient>
        <radialGradient id="nozzleGlow">
          <stop offset="0" stop-color="#ffd877" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd877" stop-opacity="0"/>
        </radialGradient>
        <!-- Foam shading for the candidate glasses; y1/y2 follow the head each frame. -->
        <linearGradient id="foamGrad" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="10">
          <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ecdcb8"/>
        </linearGradient>
      </defs>

      <!-- Tap: illustrated brewery faucet in named parts (shank, nut, body,
           spout, handle with a swappable badge). The handle follows sim
           flow, so the 150 ms ramp is visible; the nozzle glows while the
           tap is open. Stream starts at the nozzle, (210, 72). -->
      <g id="tap" stroke="#24170d" stroke-width="1.6" stroke-linejoin="round">
        <rect id="tapShank" x="224" y="28" width="130" height="17" rx="8.5" fill="url(#metalH)"/>
        <path d="M232,32 L340,32" stroke="#fffaf0" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
        <rect id="tapNut" x="219" y="23" width="12" height="27" rx="3" fill="url(#metalV)"/>
        <path id="tapBody" d="M195,31 Q195,22 204,22 L216,22 Q225,22 225,31 L225,49 Q225,57 218,59 L216,62 L204,62 L202,59 Q195,57 195,49 Z" fill="url(#metalV)"/>
        <path d="M200,30 L200,50" stroke="#fffaf0" stroke-opacity="0.7" stroke-width="2.2" stroke-linecap="round"/>
        <path id="tapSpout" d="M203.5,61 L216.5,61 L214.5,70 Q210,73.5 205.5,70 Z" fill="url(#metalV)"/>
        <ellipse cx="210" cy="71" rx="3.4" ry="1.4" fill="#120b06" stroke="none"/>
        <circle id="tapGlow" cx="210" cy="74" r="7" fill="url(#nozzleGlow)" stroke="none" opacity="0"/>
        <g id="handle">
          <rect x="206" y="12" width="8" height="12" rx="2" fill="url(#metalV)"/>
          <path id="tapHandle" d="M203.5,13 L201,-11 Q201,-20 210,-21 Q219,-20 219,-11 L216.5,13 Z" fill="url(#handleWood)"/>
          <rect id="tapBadge" x="204" y="-12.5" width="12" height="20" rx="3" fill="#a5392b" stroke="#f2d9a6" stroke-width="1"/>
          <text id="tapLabel" x="210" y="0" text-anchor="middle" font-size="6.5" font-weight="800" stroke="none"
                transform="rotate(-90 210 -2.5)" style="fill:#f8e6c0; letter-spacing:0.04em">PILS</text>
          <ellipse cx="210" cy="-20" rx="6.5" ry="2" fill="#8a5a33" stroke-width="1.2"/>
        </g>
      </g>

      <!-- Glass art that sits behind the beer (back wall), same transform as #glass. -->
      <g id="glassBack"><g id="glassBackArt"></g></g>

      <g clip-path="url(#glassClip)">
        <path id="foamFill" fill="#fbf4e2"/>
        <path id="foamTex" fill="url(#foamPat)"/>
        <path id="beerFill" fill="url(#beerGrad)"/>
        <path id="beerShine" fill="none" stroke="#fff0bf" stroke-opacity="0.6" stroke-width="1.3"/>
        <g id="bubbles" fill="#fff6d2" fill-opacity="0.7"></g>
      </g>
      <path id="stream" fill="none" stroke="#eaa72c" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="streamCore" fill="none" stroke="#fde6a0" stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="splash" fill="#fbf4e2"></g>
      <path id="spill" fill="none" stroke="#fbf4e2" stroke-width="4" stroke-linecap="round"/>

      <g id="glass">
        <!-- Glass artwork. Swapped by the glass treatment (?glass=a|b); the
             training overlays below always draw on top of it. -->
        <g id="glassArt">
          <path id="glassBody" fill="rgba(210,228,255,0.07)" stroke="rgba(230,240,255,0.8)" stroke-width="2.5" stroke-linejoin="round"/>
          <path id="glassInner" fill="none" stroke="rgba(230,240,255,0.35)" stroke-width="1"/>
          <path d="M-33,-205 L-21,-34" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>
        </g>
        <!-- Target zone: hatched band plus a dashed line plus a label, so it
             does not rely on colour (spec §6). -->
        <polygon id="zoneBand" fill="url(#hatch)" fill-opacity="0.45" stroke="#f6eedf" stroke-width="0.8" stroke-dasharray="2 2"/>
        <line id="fillLine" stroke="#f6eedf" stroke-width="1.6" stroke-dasharray="5 3"/>
        <text id="fillLabel" font-size="10" font-weight="700" text-anchor="end">LINE</text>
        <text id="stopLabel" font-size="9" font-weight="700" style="fill:#f6eedf">STOP</text>
        <!-- Training mark only: real glassware has no such line. Shown in Watch
             and Guided so the learner links "about half to two-thirds" to what
             they see; gone in Solo, where they judge it by eye. -->
        <g id="bringMark">
          <polygon id="bringBand" fill="rgba(159,220,138,0.18)" stroke="#9fdc8a" stroke-width="1.4" stroke-dasharray="1 2.5"/>
          <text id="bringLabel" font-size="9" font-weight="700" style="fill:#9fdc8a">▲ BRING UP</text>
        </g>
        <!-- Where the player acted, drawn at the level they acted at. Watch and
             Guided only; Solo sees the same marks in the debrief instead. -->
        <g id="actMarks">
          <g id="markStraighten" style="display:none">
            <line id="markStraightenLine" stroke="#9fdc8a" stroke-width="3" stroke-linecap="round"/>
            <text id="markStraightenText" font-size="8.5" font-weight="700" style="fill:#9fdc8a"></text>
          </g>
          <g id="markStop" style="display:none">
            <line id="markStopLine" stroke="#f6eedf" stroke-width="3" stroke-linecap="round"/>
            <text id="markStopText" font-size="8.5" font-weight="700" style="fill:#f6eedf"></text>
          </g>
        </g>
      </g>

      <!-- Head gauge: the head band is a thickness, not a place on the glass,
           so it gets its own scale. Top-left is the one corner the glass never
           reaches at any tilt. -->
      <g id="gauge">
        <text x="23" y="30" text-anchor="middle" font-size="10" font-weight="700">HEAD</text>
        <rect x="14" y="38" width="18" height="140" rx="3" fill="rgba(255,255,255,0.04)" stroke="#5c4a37" stroke-width="1.5"/>
        <rect id="gaugeBar" x="16" width="14" rx="2" fill="#fbf4e2"/>
        <rect id="gaugeBarTex" x="16" width="14" fill="url(#foamPat)"/>
        <rect id="gaugeBand" x="10" width="26" fill="url(#hatch)" fill-opacity="0.55" stroke="#f6eedf" stroke-width="1.2"/>
        <text id="gaugeHi" x="40" font-size="9"></text>
        <text id="gaugeLo" x="40" font-size="9"></text>
        <text id="gaugeVal" x="10" y="196" font-size="12" font-weight="700" style="fill:#f6eedf"></text>
        <text id="gaugeState" x="10" y="209" font-size="9"></text>
      </g>
      <text id="levelText" x="10" y="228" font-size="11"></text>
    </svg>
  </div>

  <section id="controls" aria-label="Pour controls">
    <div id="angleCtl">
      <div id="sliderWrap">
        <div class="ctl-head"><label for="angleSlider">Glass angle</label><output id="angleOut" for="angleSlider">0°</output></div>
        <input type="range" id="angleSlider" min="0" max="60" step="1" value="0" aria-valuetext="0 degrees, upright">
        <div class="ticks" aria-hidden="true"><span style="left:0">Upright 0°</span><span style="left:75%">45°</span><span style="left:100%;transform:translateX(-100%)">60°</span></div>
      </div>
      <div id="toggleWrap" hidden>
        <button type="button" id="angleToggle" role="switch" aria-checked="false" aria-label="Tilt the glass to 45 degrees">
          <span class="opt opt-up" aria-hidden="true">Upright</span>
          <span class="opt opt-tilt" aria-hidden="true">Tilted ~45°</span>
        </button>
      </div>
    </div>

    <div id="pourRow">
      <button type="button" id="pour" aria-pressed="false" aria-describedby="pourHelp">
        <span class="padText"><span id="pourText">Hold to pour</span><span class="sub" id="pourSub"></span></span>
        <span id="padTrack" aria-hidden="true"><span id="padThumb"></span></span>
        <span id="padFinger" aria-hidden="true" hidden></span>
      </button>
      <label class="tapmode"><input type="checkbox" id="tapMode"><span>Tap to start/stop pouring</span></label>
    </div>
    <p id="pourHelp" class="sr-only">Hold the button, or hold Space or Enter, to pour. Turn on tap mode to start and stop with single presses. Use the glass switch, or the T key, to tilt the glass and to bring it upright.</p>

    <div id="actions">
      <button type="button" id="serve" disabled>Serve<kbd>S</kbd></button>
      <button type="button" id="restart">Restart<kbd>R</kbd></button>
    </div>

    <div id="ghostActions" hidden>
      <button type="button" id="replay">Replay</button>
      <button type="button" id="skip">Skip to Guided</button>
    </div>
    <div id="transcriptBox" hidden>
      <span id="transcriptTitle">Steps in this demo</span>
      <ol id="transcript" aria-labelledby="transcriptTitle"></ol>
      <p class="fineprint">Two bands on the training glass: <b>BRING UP</b> (start bringing the glass upright when the beer gets there) and <b>LINE</b> (stop). BRING UP is a training mark that real glasses don't have; on the job, judge it by eye: about half to two-thirds full. Keep holding the pad the whole time: slide up and the glass comes up; stop sliding and it holds its angle while the beer keeps flowing.</p>
    </div>
  </section>
</div>

<section id="result" aria-labelledby="resultTitle" hidden>
  <h2 id="resultTitle"></h2>
  <h3 class="chk-head">Technique</h3>

  <h3 class="chk-head">The pour</h3>

    <p id="debriefText"></p>
  </div>
  <p id="fbPrimary"></p>
  <p id="fbSecondary" hidden></p>
  <p id="suggest" hidden></p>
  <p class="fineprint">Prototype: the steps follow common beer-service guidance (see docs/pour-procedure.md); the exact numbers are placeholders, not yet checked first-hand.</p>
