      <div id="angleCtl">
        <div id="toggleWrap">
          <button aria-checked="false" aria-disabled="true" aria-label="Tilt the glass to 45 degrees" id="angleToggle" role="switch" type="button">
            <span aria-hidden="true" class="opt opt-up">
              "Upright"
            <span aria-hidden="true" class="opt opt-tilt">
              "Tilted ~45°"
      <div id="pourRow">
        <button aria-describedby="pourHelp" aria-disabled="true" aria-pressed="false" id="pour" type="button">
          <span class="padText">
            <span id="pourText">
              "Demo"
            <span class="sub" id="pourSub">
              "watch the thumb"
          <span aria-hidden="true" id="padTrack">
            <span id="padThumb" style="top: 0%;">
          <span aria-hidden="true" hidden="" id="padFinger">
        <label class="tapmode">
          <input id="tapMode" type="checkbox">
          <span>
            "Tap to start/stop pouring"
      <p class="sr-only" id="pourHelp">
        "Hold the button, or hold Space or Enter, to pour. Slide up on the button, or press the Up arrow, to bring the glass upright. Turn on tap mode to start and stop with single presses. Use the glass switch, or the T key, to tilt the glass."
      <div hidden="" id="actions">
        <button disabled="" id="serve" type="button">
          "Serve"
          <kbd>
            "S"
        <button id="restart" type="button">
          "Restart"
          <kbd>
            "R"
      <div id="ghostActions">
        <button id="replay" type="button">
          "Replay"
        <button id="calmer" type="button">
          "Watch a calmer pour"
        <button id="skip" type="button">
          "Skip to Guided"
      <div class="is-folded" id="transcriptBox">
        <button aria-controls="transcript" aria-expanded="false" class="st-steps-toggle" type="button">
          "Show all steps"
        <span id="transcriptTitle">
          "Steps in this demo"
        <ol aria-labelledby="transcriptTitle" id="transcript">
          <li aria-current="step">
            "Same routine as the Pilsner: tilt the glass to about 45°."
          <li>
            "Open the tap fully and watch the foam. This one is building it fast."
          <li>
            "Past half full, but plenty of foam already: stay tilted a little longer."
          <li>
            "Now bring the glass up. Read the foam each time: later when it builds fast, sooner when it builds slowly."
          <li>
            "Finish upright to build the big wheat-beer head."
          <li>
            "The head reached the LINE: let go, then serve."
        <p class="fineprint">
          "Same pad as the Pilsner: keep holding, slide up to bring the glass up, let go at the"
          <b>
            "LINE"
          ". There is no BRING UP band here: watch the foam already on the beer while the glass is tilted. Lots of foam, stay tilted longer; little foam, come up sooner. How lively each pour is varies in this training game."
