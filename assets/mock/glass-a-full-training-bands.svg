<?xml version="1.0" encoding="UTF-8"?>
<svg id="scene" viewBox="108.5 104.0 218.8 241.0" xmlns="http://www.w3.org/2000/svg" width="875" height="964">
      
      
      <defs>
        <clipPath id="glassClip" clipPathUnits="userSpaceOnUse"><polygon id="clipPoly" points="171.94,112.00 187.00,327.00 233.00,327.00 248.06,112.00"/></clipPath>
        <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7c948"/>
          <stop offset="0.6" stop-color="#e7a526"/>
          <stop offset="1" stop-color="#c9811a"/>
        </linearGradient>
        <pattern id="foamPat" width="9" height="8" patternUnits="userSpaceOnUse">
          <circle cx="2.5" cy="2.5" r="1.7" fill="#e9dcbd"/>
          <circle cx="7" cy="6" r="1.2" fill="#ece1c6"/>
        </pattern>
        <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="5" stroke="#f6eedf" stroke-width="1.4"/>
        </pattern>
        <!-- Faucet materials: warm brushed metal, not cold chrome. -->
        <linearGradient id="metalH" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3ead9"/><stop offset="0.45" stop-color="#cdc2ae"/><stop offset="1" stop-color="#857b6c"/>
        </linearGradient>
        <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a8072"/><stop offset="0.3" stop-color="#efe5d2"/><stop offset="0.62" stop-color="#cbbfab"/><stop offset="1" stop-color="#7d7466"/>
        </linearGradient>
        <linearGradient id="handleWood" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#2e1a0d"/><stop offset="0.38" stop-color="#6e4325"/><stop offset="0.7" stop-color="#57331b"/><stop offset="1" stop-color="#2a170b"/>
        </linearGradient>
        <radialGradient id="nozzleGlow">
          <stop offset="0" stop-color="#ffd877" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd877" stop-opacity="0"/>
        </radialGradient>
        <!-- Foam shading for the candidate glasses; y1/y2 follow the head each frame. -->
        <linearGradient id="foamGrad" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="122.4" y2="147.9">
          <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ecdcb8"/>
        </linearGradient>
      </defs>

      <!-- Tap: illustrated brewery faucet in named parts (shank, nut, body,
           spout, handle with a swappable badge). The handle follows sim
           flow, so the 150 ms ramp is visible; the nozzle glows while the
           tap is open. Stream starts at the nozzle, (210, 72). -->
      

      <!-- Glass art that sits behind the beer (back wall), same transform as #glass. -->
      <g id="glassBack" transform="translate(210.00 339.00) rotate(0.00)"><g id="glassBackArt"><polygon points="-38.055,-227 -23.005,-12 23.005,-12 38.055,-227" fill="rgba(214,230,255,0.045)"/></g></g>

      <g clip-path="url(#glassClip)">
        <path id="foamFill" fill="url(#foamGrad)" d="M0,122.63L17,123.73L34,122.76L51,121.27L68,121.63L85,123.27L102,123.57L119,122.05L136,121.14L153,122.29L170,123.67L187,123.08L204,121.46L221,121.39L238,122.99L255,123.70L272,122.39L289,121.15L306,121.95L323,123.52L340,123.35L340,400L0,400Z"/>
        <path id="foamTex" fill="url(#foamPat)" d="M0,122.63L17,123.73L34,122.76L51,121.27L68,121.63L85,123.27L102,123.57L119,122.05L136,121.14L153,122.29L170,123.67L187,123.08L204,121.46L221,121.39L238,122.99L255,123.70L272,122.39L289,121.15L306,121.95L323,123.52L340,123.35L340,400L0,400Z"/>
        <path id="beerFill" fill="url(#beerGrad)" d="M0,147.53L17,147.90L34,148.27L51,148.18L68,147.74L85,147.50L102,147.77L119,148.20L136,148.26L153,147.86L170,147.52L187,147.65L204,148.10L221,148.30L238,148.00L255,147.58L272,147.56L289,147.97L306,148.29L323,148.12L340,147.67L340,400L0,400Z"/>
        <path id="beerShine" fill="none" stroke="#fff0bf" stroke-opacity="0.6" stroke-width="1.3" d="M0,147.53L17,147.90L34,148.27L51,148.18L68,147.74L85,147.50L102,147.77L119,148.20L136,148.26L153,147.86L170,147.52L187,147.65L204,148.10L221,148.30L238,148.00L255,147.58L272,147.56L289,147.97L306,148.29L323,148.12L340,147.67"/>
        <g id="bubbles" fill="#fff6d2" fill-opacity="0.7"><circle r="0.9" cx="192.30" cy="292.84"/><circle r="1.35" cx="192.80" cy="204.61"/><circle r="1.8" cx="192.23" cy="258.00"/><circle r="0.9" cx="191.35" cy="311.40"/><circle r="1.35" cx="191.34" cy="223.16"/><circle r="1.8" cx="192.21" cy="276.55"/><circle r="0.9" cx="192.80" cy="156.85"/><circle r="1.35" cx="192.32" cy="241.71"/><circle r="1.8" cx="192.76" cy="295.11"/><circle r="0.9" cx="192.49" cy="175.40"/><circle r="1.35" cx="191.57" cy="228.79"/><circle r="1.8" cx="191.22" cy="313.66"/><circle r="0.9" cx="191.92" cy="193.95"/><circle r="1.35" cx="192.72" cy="247.35"/></g>
      </g>
      
      
      
      

      <g id="glass" transform="translate(210.00 339.00) rotate(0.00)">
        <!-- Glass artwork. Swapped by the glass treatment (?glass=a|b); the
             training overlays below always draw on top of it. -->
        <g id="glassArt">
          <defs><linearGradient id="gA_base" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f4f9ff" stop-opacity="0.32"/><stop offset="1" stop-color="#f4f9ff" stop-opacity="0.62"/>
          </linearGradient></defs>
          <path d="M-42.055,-229 L-27.005,-10 Q-28.005,-4 -34,-2 L-34,0 L34,0 L34,-2 Q28.005,-4 27.005,-10 L42.055,-229 L38.055,-227 L23.005,-12 L-23.005,-12 L-38.055,-227 Z" fill="rgba(226,238,255,0.13)" stroke="rgba(238,246,255,0.92)" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M-27.005,-11 L27.005,-11 L29.005,-3 Q30.005,0 26.005,0 L-26.005,0 Q-30.005,0 -29.005,-3 Z" fill="url(#gA_base)" stroke="rgba(238,246,255,0.92)" stroke-width="1.4"/>
          <ellipse cx="0" cy="-8" rx="18.0" ry="1.8" fill="rgba(255,255,255,0.32)"/>
          <line x1="-42.055" y1="-228" x2="42.055" y2="-228" stroke="rgba(255,255,255,0.8)" stroke-width="2.4" stroke-linecap="round"/>
          <polygon points="-19.1,-27.1 -32.0,-212.0 -28.0,-212.0 -15.1,-27.1" fill="rgba(255,255,255,0.24)"/>
          <polygon points="28.3,-130.3 32.9,-196.9 30.9,-196.9 26.3,-130.3" fill="rgba(255,255,255,0.14)"/></g>
        <!-- Target zone: hatched band plus a dashed line plus a label, so it
             does not rely on colour (spec §6). -->
        <polygon id="zoneBand" fill="url(#hatch)" fill-opacity="0.45" stroke="#f6eedf" stroke-width="0.8" stroke-dasharray="2 2" points="-37.0015,-211.95 37.0015,-211.95 37.6035,-220.54999999999998 -37.6035,-220.54999999999998"/>
        <line id="fillLine" stroke="#f6eedf" stroke-width="1.6" stroke-dasharray="5 3" x1="-37.302499999999995" x2="37.302499999999995" y1="-216.25" y2="-216.25"/>
        <text id="fillLabel" font-size="10" font-weight="700" text-anchor="end" x="-45.302499999999995" y="-212.25" font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#c9b89c">LINE</text>
        <text id="stopLabel" font-size="9" font-weight="700" style="fill: rgb(246, 238, 223); display: none;" x="45.3" y="-213.3" font-family="system-ui, -apple-system, Segoe UI, sans-serif">STOP</text>
        <!-- Training mark only: real glassware has no such line. Shown in Watch
             and Guided so the learner links "about half to two-thirds" to what
             they see; gone in Solo, where they judge it by eye. -->
        <g id="bringMark">
          <polygon id="bringBand" fill="rgba(159,220,138,0.18)" stroke="#9fdc8a" stroke-width="1.4" stroke-dasharray="1 2.5" points="-30.53,-119.5 30.53,-119.5 33.088499999999996,-156.05 -33.088499999999996,-156.05"/>
          <text id="bringLabel" font-size="9" font-weight="700" style="fill: rgb(159, 220, 138); display: none;" x="41.1" y="-134.8" font-family="system-ui, -apple-system, Segoe UI, sans-serif">▲ BRING UP</text>
        </g>
        <!-- Where the player acted, drawn at the level they acted at. Watch and
             Guided only; Solo sees the same marks in the debrief instead. -->
        
      </g>

      <!-- Head gauge: the head band is a thickness, not a place on the glass,
           so it gets its own scale. Top-left is the one corner the glass never
           reaches at any tilt. -->
      
      
    </svg>